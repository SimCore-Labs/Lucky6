name: Deploy Lucky Six backend services to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'backend/**'
      - 'packages/contracts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-lucky6-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy engine to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            pm2 stop lucky6-backend lucky6-engine lucky6-settlement lucky6-payment-worker
            cd ~/Lucky6-deploy
            git pull --ff-only origin main
            npm ci --workspace=@lucky-six/contracts --workspace=backend --workspace=engine --workspace=settlement --workspace=payment-worker
            npm run build --workspace=@lucky-six/contracts
            npm run db:migrate:deploy --workspace=backend
            npm run build --workspace=backend
            npm run build --workspace=@lucky-six/engine
            npm run build --workspace=@lucky-six/settlement
            npm run build --workspace=@lucky-six/payment-worker
            pm2 restart lucky6-backend lucky6-engine lucky6-settlement lucky6-payment-worker --update-env
            pm2 save
            curl --fail --silent --show-error http://127.0.0.1:4000/health
            curl --fail --silent --show-error http://127.0.0.1:4100/health/live
            curl --fail --silent --show-error http://127.0.0.1:4200/health/live
            curl --fail --silent --show-error http://127.0.0.1:4300/health/live
